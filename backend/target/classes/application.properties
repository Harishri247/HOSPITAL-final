server.port=8080

# Application
spring.application.name=hpms-backend

# Database Configuration (PostgreSQL 18 - Real Data Storage via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospital_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2334}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration (CRITICAL SAFETY: NEVER use update or create-drop against real data)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Non-Destructive Migrations (Baseline against existing dataset)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0
spring.flyway.baseline-description=Existing Database Baseline

# Real Production Data Mode: Demo seed generation strictly disabled
app.seed-demo-data=false

# Security JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.hospital.hpms=INFO
logging.level.org.springframework.security=WARN
